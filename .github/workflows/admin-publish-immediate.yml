name: Immediate Admin Publish Pipeline

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Reason for immediate publish'
        required: true
        default: 'Admin live changes publish'
      actor_email:
        description: 'Admin or Actor triggering the publish'
        required: false
        default: 'admin'

jobs:
  immediate-publish:
    name: Immediate Build & Verification Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Supabase Production Database Connectivity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Triggered by: ${{ github.event.inputs.actor_email }}"
          echo "Reason: ${{ github.event.inputs.trigger_reason }}"
          node -e "
            (async () => {
              try {
                const url = (process.env.SUPABASE_URL || '').trim();
                const key = (process.env.SUPABASE_ANON_KEY || '').trim();
                if (!url || !key) {
                  console.log('Notice: SUPABASE_URL or SUPABASE_ANON_KEY not set in GitHub Secrets. Skipping DB check.');
                  process.exit(0);
                }
                const formattedUrl = url.startsWith('http') ? url : 'https://' + url + '.supabase.co';
                const { createClient } = require('@supabase/supabase-js');
                const client = createClient(formattedUrl, key);
                const res = await client.from('products').select('id', { count: 'exact', head: true });
                if (res.error) {
                  console.warn('Notice: Supabase connectivity notice:', res.error.message);
                } else {
                  console.log('✓ Supabase connection verified (' + res.count + ' products active).');
                }
              } catch (err) {
                console.warn('Notice during Supabase immediate publish check:', err.message);
              }
              process.exit(0);
            })();
          "

      - name: Production Build Validation
        run: npm run build:prod

      - name: Report Publish Status
        run: |
          echo "Build completed successfully. Committed changes are automatically deployed by Vercel."
