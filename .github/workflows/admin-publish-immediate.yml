name: Immediate Admin Publish Pipeline

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Reason for immediate publish'
        required: true
        default: 'Admin live changes publish'
      actor_email:
        description: 'Admin or Actor triggering the publish'
        required: false
        default: 'admin'

jobs:
  immediate-publish:
    name: Immediate Build & Verification Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Public Data Catalogs
        run: |
          echo "Triggered by: ${{ github.event.inputs.actor_email }}"
          echo "Reason: ${{ github.event.inputs.trigger_reason }}"
          node -e "
            const fs = require('fs');
            const files = ['products.json', 'accessories.json', 'services.json', 'shop-owners.json', 'orders.json', 'bookings.json'];
            for (const f of files) {
              const p = 'public/data/' + f;
              if (fs.existsSync(p)) {
                try {
                  const data = JSON.parse(fs.readFileSync(p, 'utf8'));
                  console.log('✓ ' + f + ' validated (' + (Array.isArray(data) ? data.length + ' items' : 'object') + ')');
                } catch (err) {
                  console.error('✗ ' + f + ' JSON syntax error:', err.message);
                  process.exit(1);
                }
              }
            }
          "

      - name: Production Build Validation
        run: npm run build -- --configuration=production

      - name: Report Publish Status
        run: |
          echo "Build completed successfully. Committed changes are automatically deployed by Vercel."
