name: Development CI & Deployment Gate

on:
  push:
    branches:
      - develop

jobs:
  quality-gate:
    name: Development Quality Gate
    uses: ./.github/workflows/ci.yml

  notify-status:
    name: Vercel Preview Deployment Check
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Build Readiness
        run: |
          echo "Quality gate passed successfully."
          echo "Vercel automatically creates preview deployments for 'develop' branch."
