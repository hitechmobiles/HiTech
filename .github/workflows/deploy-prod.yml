name: Production CI & Deployment Gate

on:
  push:
    branches:
      - main

jobs:
  quality-gate:
    name: Production Quality Gate
    uses: ./.github/workflows/ci.yml

  notify-status:
    name: Vercel Production Deployment Check
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Build Readiness
        run: |
          echo "Quality gate passed successfully."
          echo "Vercel automatically deploys commits pushed to 'main' branch."
