<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Primary Tech Cyan/Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Wholesale Layers Gradient -->
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Premium Gold/Amber Gradient for Service & B2B -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Soft Neon Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Rounded Square -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="196" height="196" rx="42" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.35" />

  <!-- Emblem Mark Centered -->
  <g transform="translate(5, 5)">
    <!-- Outer Hexagon Shield (Trust & Wholesale Network) -->
    <polygon points="95,0 175,45 175,145 95,190 15,145 15,45" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-opacity="0.45" />

    <!-- Wholesale Bulk Stack Layers (Back) -->
    <rect x="78" y="24" width="76" height="128" rx="14" fill="url(#layerGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(12 116 88)" />
    <rect x="66" y="28" width="76" height="128" rx="14" fill="url(#layerGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.65" transform="rotate(6 104 92)" />

    <!-- Main Foreground Smartphone Body -->
    <rect x="48" y="32" width="78" height="130" rx="14" fill="#060B19" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#subtleGlow)" />

    <!-- Top Speaker / Dynamic Notch -->
    <line x1="77" y1="42" x2="97" y2="42" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Stylized 'H' + Circuit Service Emblem Inside Phone -->
    <path d="M 64 58 L 75 58 L 75 136 L 64 136 Z" fill="url(#cyanGrad)" />
    <path d="M 99 58 L 110 58 L 110 136 L 99 136 Z" fill="url(#cyanGrad)" />

    <!-- Service Crossbar + Upward Growth/Signal Wave (Gold Accent) -->
    <path d="M 56 102 L 75 102 L 87 82 L 99 102 L 118 102" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

    <!-- Precision Service Gear / Circuit Nodes -->
    <circle cx="87" cy="82" r="4.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="69.5" cy="70" r="2.5" fill="#00F2FE" />
    <circle cx="104.5" cy="124" r="2.5" fill="#00F2FE" />

    <!-- Bottom Wholesale Connection Node -->
    <circle cx="87" cy="151" r="2.5" fill="#94A3B8" />
  </g>
</svg>
