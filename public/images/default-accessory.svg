<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="accBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="adapterBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="accShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#8b5cf6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" rx="20" fill="url(#accBgGrad)" />

  <!-- Ambient Light Halo -->
  <circle cx="200" cy="180" r="140" fill="url(#purpleGlow)" />

  <!-- Composition: Power Adapter, Braided Cable & Earbuds -->
  <g filter="url(#accShadow)" transform="translate(60, 50)">
    <!-- 1. Wireless Earbuds Case -->
    <g transform="translate(160, 40)">
      <rect x="0" y="0" width="105" height="120" rx="30" fill="url(#adapterBody)" stroke="#475569" stroke-width="2" />
      <!-- Lid seam -->
      <line x1="2" y1="42" x2="103" y2="42" stroke="#64748b" stroke-width="1.5" />
      <!-- LED Indicator dot -->
      <circle cx="52.5" cy="58" r="3" fill="#10b981" />
      <!-- Brand on case -->
      <text x="52.5" y="86" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1">HI-TECH</text>
    </g>

    <!-- 2. Fast Charging Power Brick -->
    <g transform="translate(25, 110)">
      <rect x="0" y="20" width="110" height="120" rx="20" fill="url(#adapterBody)" stroke="#38bdf8" stroke-width="1.8" />
      <!-- Prongs -->
      <rect x="25" y="0" width="16" height="22" rx="4" fill="#94a3b8" />
      <rect x="69" y="0" width="16" height="22" rx="4" fill="#94a3b8" />
      <!-- USB-C Port Highlight -->
      <rect x="35" y="75" width="40" height="12" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="43" y="79" width="24" height="4" rx="2" fill="#38bdf8" />
      <!-- Fast Charging Lightning Logo -->
      <path d="M 57,40 L 47,56 L 55,56 L 53,70 L 65,52 L 57,52 Z" fill="url(#cyanAccent)" />
      <!-- Power Wattage Text -->
      <text x="55" y="112" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="800" fill="#cbd5e1" letter-spacing="0.5">65W FAST CHARGE</text>
    </g>

    <!-- 3. Braided Cable Arc -->
    <path d="M 55,200 C 55,270 180,270 210,200 C 230,150 250,220 250,240" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2,5" opacity="0.8" />
    <path d="M 55,200 C 55,270 180,270 210,200 C 230,150 250,220 250,240" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- 4. USB-C Connector Head -->
    <g transform="translate(240, 230) rotate(-25)">
      <rect x="0" y="0" width="18" height="28" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1" />
      <rect x="4" y="28" width="10" height="12" rx="2" fill="#e2e8f0" />
    </g>
  </g>

  <!-- Bottom Verification Badge -->
  <g transform="translate(200, 362)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="-73" cy="0" r="4" fill="#a855f7" />
    <text x="-61" y="4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.3">100% Genuine Accessory</text>
  </g>
</svg>
