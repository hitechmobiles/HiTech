<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Light Halo -->
  <circle cx="200" cy="180" r="130" fill="url(#glowGrad)" />

  <!-- Smartphone Chassis Group -->
  <g filter="url(#phoneShadow)" transform="translate(115, 45)">
    <!-- Outer Metallic Bezel -->
    <rect x="0" y="0" width="170" height="290" rx="32" fill="url(#bezelGrad)" />
    <!-- Inner Dark Frame -->
    <rect x="3" y="3" width="164" height="284" rx="29" fill="#020617" />
    <!-- Display Screen -->
    <rect x="7" y="7" width="156" height="276" rx="25" fill="#0b1329" />

    <!-- Screen Glowing UI Art -->
    <path d="M 7,120 Q 80,60 163,140 L 163,283 L 7,283 Z" fill="url(#screenGrad)" opacity="0.35" />
    <path d="M 7,170 Q 90,110 163,180 L 163,283 L 7,283 Z" fill="url(#screenGrad)" opacity="0.5" />

    <!-- Speaker Ear Piece & Notch -->
    <rect x="65" y="14" width="40" height="5" rx="2.5" fill="#1e293b" />
    <!-- Front Punch Hole Camera -->
    <circle cx="85" cy="28" r="4.5" fill="#020617" stroke="#334155" stroke-width="1.5" />
    <circle cx="86" cy="27" r="1.5" fill="#38bdf8" />

    <!-- Center HiTech Certified Hologram -->
    <g transform="translate(85, 125)">
      <!-- HiTech Brand Emblem -->
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
      <path d="M-12,-10 L-6,-10 L-6,-2 L6,-2 L6,-10 L12,-10 L12,10 L6,10 L6,3 L-6,3 L-6,10 L-12,10 Z" fill="#38bdf8" />
      <!-- Pulse Ring -->
      <circle cx="0" cy="0" r="33" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    </g>

    <text x="85" y="176" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="800" fill="#f8fafc" letter-spacing="1.5">HI-TECH</text>
    <text x="85" y="191" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" font-weight="600" fill="#38bdf8" letter-spacing="0.8">5G SMARTPHONE</text>

    <!-- Home Bottom Navigation Indicator Bar -->
    <rect x="55" y="271" width="60" height="4" rx="2" fill="#94a3b8" opacity="0.8" />
  </g>

  <!-- Bottom Verification Badge -->
  <g transform="translate(200, 362)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#10b981" />
    <text x="-56" y="4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.3">Official Product Image</text>
  </g>
</svg>

