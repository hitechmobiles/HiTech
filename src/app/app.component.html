<div class="app-layout">
  <app-header></app-header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>

  <!-- Global Cyber Toast Notification -->
  @if (toastService.activeToast(); as toast) {
    <div class="toast-floating-wrapper animate-fade-in">
      <div class="toast-box" [ngClass]="'toast-' + toast.type">
        <div class="toast-icon">
          @if (toast.type === 'success') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          } @else if (toast.type === 'danger') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          } @else if (toast.type === 'warning') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          }
        </div>
        <div class="toast-body">
          @if (toast.title) {
            <h5 class="toast-title">{{ toast.title }}</h5>
          }
          <p class="toast-message">{{ toast.message }}</p>
        </div>
        <button class="toast-close" (click)="toastService.clear()" aria-label="Close alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
  }

  <!-- Universal Scroll to Top Floating Action Button -->
  @if (showScrollTop) {
    <button
      type="button"
      class="scroll-to-top-btn animate-fade-in"
      (click)="scrollToTop()"
      title="Scroll back to top"
      aria-label="Scroll back to top">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m18 15-6-6-6 6"/>
      </svg>
    </button>
  }
</div>
