<div
  class="hitech-loader-container"
  [class.full-page]="fullPage"
  [class.inline-mode]="inline"
  [class.size-sm]="size === 'small'"
  [class.size-lg]="size === 'large'">
  
  <!-- Holographic Cyber Spinner Element -->
  <div class="spinner-core-wrap">
    <div class="ring outer-ring"></div>
    <div class="ring mid-ring"></div>
    <div class="ring inner-ring"></div>
    <div class="pulse-center">
      <svg class="center-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
        <line x1="12" y1="18" x2="12.01" y2="18"/>
      </svg>
    </div>
  </div>

  <!-- Loading Messages -->
  <div class="loader-text-area" *ngIf="message">
    <div class="loader-title-box">
      <span class="live-status-pill">
        <span class="pulse-ping"></span>
        <span>CONNECTING</span>
      </span>
      <h3 class="loader-primary-msg">{{ message }}</h3>
    </div>
    
    <p class="loader-sub-msg" *ngIf="subMessage">{{ subMessage }}</p>

    <!-- High-Tech Shimmer Bar -->
    <div class="progress-track">
      <div class="progress-bar-shimmer"></div>
    </div>
  </div>
</div>
